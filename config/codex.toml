# Codex（桌面端 / CLI）MCP 配置 —— 已实测 ✅
#
# 用法：把以下两段追加到 ~/.codex/config.toml，然后重启 Codex。
# 对话中输入 /mcp 可查看已连接状态。
#
# 注意：<python> 替换为你的 Python 可执行文件（示例：C:\Python312\python.exe），
#       <项目根目录> 替换为仓库绝对路径（示例：C:\repos\ollama-mcp-workers）。

# ---------- Vision Worker（qwen2.5vl:7b）----------
[mcp_servers.vision]
command = "<python>"
args = ["<项目根目录>/run.py"]
startup_timeout_sec = 10
tool_timeout_sec = 120
default_tools_approval_mode = "auto"

[mcp_servers.vision.env]
OLLAMA_HOST = "http://127.0.0.1:11434"
VISION_MODEL = "qwen2.5vl:7b"
OLLAMA_TIMEOUT = "120"
MAX_IMAGE_SIZE = "5242880"
MAX_IMAGE_DIM = "1024"
OLLAMA_NUM_CTX = "8192"

# ---------- Document Worker（qwen3:4b）----------
[mcp_servers.doc-worker]
command = "<python>"
args = ["<项目根目录>/doc_worker.py"]
startup_timeout_sec = 10
tool_timeout_sec = 300
default_tools_approval_mode = "auto"

[mcp_servers.doc-worker.env]
OLLAMA_HOST = "http://127.0.0.1:11434"
DOC_MODEL = "qwen3:4b"
OLLAMA_TIMEOUT = "300"
OLLAMA_NUM_CTX = "8192"

# ---------- 显存调度约定（两个 Worker 共用一块 6GB 显存）----------
# 调用工具时按场景传 unload_after_task：
#   预计连续调用同一个 Worker  -> unload_after_task=false（保持驻留）
#   本次调用后切换 Worker / 长时间不用 -> unload_after_task=true（默认值）
